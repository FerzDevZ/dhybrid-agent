name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write   # trusted publishing ke PyPI

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: pip install --upgrade pip build

      - name: Validasi versi pyproject cocok dengan tag
        run: |
          V="v$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          [ "$V" = "$GITHUB_REF_NAME" ] || { echo "versi pyproject ($V) != tag ($GITHUB_REF_NAME)"; exit 1; }

      - name: Build wheel + sdist
        run: python -m build

      - name: Publish ke PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      - name: Buat GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true