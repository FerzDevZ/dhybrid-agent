# Dependabot — auto-update dependency & GitHub Actions version
# Format dokumen: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # Python dependencies (pyproject.toml, contiguous range via pip)
  - package-ecosystem: "pip"
    directory: "/"               # pyproject.toml di root
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      dev-dependencies:
        applies-to: version-updates
        patterns:
          - "pytest*"
          - "pytest-*"
          - "ruff"
          - "bandit"
          - "pip-audit"

  # GitHub Actions versions (reduces deprecation warnings in CI)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "06:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(ci)"