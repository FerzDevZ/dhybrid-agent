workspace: ~/.dhybrid

model:
  provider: openai
  model: gpt-4o-mini
  api_key_env: OPENAI_API_KEY
  max_tokens: 4096
  temperature: 0.2
  # small_model: preset model murah untuk tugas mekanis (hybrid router)
  small_model: openai-fast

budget:
  soft: 60000              # trigger compaction
  hard: 120000             # force stop/compact

context:
  keep_recent: 8           # pesan terakhir yang dipertahankan verbatim
  compact_ratio: 0.5

tool:
  max_output_chars: 8000
  allowlist: [terminal, read_file, write_file, apply_patch, grep, find_files, git_status, git_diff, git_commit, git_log, run_tests, tdd_status, todo_add, todo_list, todo_done, memory_set, memory_get, subagent]

presets:
  openai-fast:
    provider: openai
    model: gpt-4o-mini
    api_key_env: OPENAI_API_KEY
    cost_per_1k_input: 0.15
    cost_per_1k_output: 0.60
  openai-big:
    provider: openai
    model: gpt-4o
    api_key_env: OPENAI_API_KEY
    cost_per_1k_input: 2.5
    cost_per_1k_output: 10.0
  anthropic-fast:
    provider: anthropic
    model: claude-3-5-haiku-latest
    api_key_env: ANTHROPIC_API_KEY
    cost_per_1k_input: 1.0
    cost_per_1k_output: 5.0
  anthropic-big:
    provider: anthropic
    model: claude-sonnet-4-20250514
    api_key_env: ANTHROPIC_API_KEY
    cost_per_1k_input: 3.0
    cost_per_1k_output: 15.0
  openrouter-fast:
    provider: openai
    model: deepseek/deepseek-chat
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    cost_per_1k_input: 0.27
    cost_per_1k_output: 1.1
  openrouter-big:
    provider: openai
    model: anthropic/claude-sonnet-4
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    cost_per_1k_input: 3.0
    cost_per_1k_output: 15.0
  gemini-fast:
    provider: openai
    model: gemini-2.5-flash
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY
    cost_per_1k_input: 0.1
    cost_per_1k_output: 0.4
  gemini-big:
    provider: openai
    model: gemini-2.5-pro
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY
    cost_per_1k_input: 1.25
    cost_per_1k_output: 10.0
  groq-fast:
    provider: openai
    model: llama-3.3-70b-versatile
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    cost_per_1k_input: 0.59
    cost_per_1k_output: 0.79
  deepseek-fast:
    provider: openai
    model: deepseek-chat
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    cost_per_1k_input: 0.27
    cost_per_1k_output: 1.1

delegation:
  max_active: 3
  max_result_chars: 2000
  max_steps: 15

skills:
  dir: skills
  max_inject: 3
  max_chars: 800
