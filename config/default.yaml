workspace: ~/.dhybrid

model:
  # SATU model — dipilih user kapan saja: /settings atau dhybrid --model <preset>.
  # TANPA model backup/chain. Default = Gemini (gemini-flash-latest, key dari .env).
  # Jalan TANPA tool calling kalau key kosong. Pilih preset lain di /settings bila perlu.
  provider: openai
  model: gemini-flash-latest
  base_url: https://generativelanguage.googleapis.com/v1beta/openai
  api_key_env: GEMINI_API_KEY
  max_tokens: 4096
  temperature: 0.2
  chain: ["opencode-zen-big", "openrouter-big", "anthropic-big"]  # escalation quality chain

budget:
  soft: 60000              # trigger compaction
  hard: 120000             # force stop/compact

context:
  keep_recent: 8           # pesan terakhir yang dipertahankan verbatim
  compact_ratio: 0.5

tool:
  max_output_chars: 8000
  allowlist: [terminal, read_file, write_file, apply_patch, grep, find_files, git_status, git_diff, git_commit, git_log, run_tests, tdd_status, todo_add, todo_list, todo_done, memory_set, memory_get, memory_search, subagent, web_fetch, web_search, http_request, ask_user, read_document, code_map, mem_index, mem_search, mem_reset, browser, read_image, clarify]
  # mcp_servers: daftar MCP server eksternal (stdio). Contoh:
  #   mcp_servers:
  #     - {name: fs, command: npx, args: ["-y", "@modelcontextprotocol/server-filesystem", "/path"]}
  mcp_servers: []

presets:
  openai-fast:
    provider: openai
    model: gpt-4o-mini
    api_key_env: OPENAI_API_KEY
    cost_per_1k_input: 0.15
    cost_per_1k_output: 0.60
  openai-big:
    provider: openai
    model: gpt-4o
    api_key_env: OPENAI_API_KEY
    cost_per_1k_input: 2.5
    cost_per_1k_output: 10.0
  anthropic-fast:
    provider: anthropic
    model: claude-3-5-haiku-latest
    api_key_env: ANTHROPIC_API_KEY
    cost_per_1k_input: 1.0
    cost_per_1k_output: 5.0
  anthropic-big:
    provider: anthropic
    model: claude-sonnet-4-20250514
    api_key_env: ANTHROPIC_API_KEY
    cost_per_1k_input: 3.0
    cost_per_1k_output: 15.0
  openrouter-fast:
    provider: openai
    model: deepseek/deepseek-chat
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    cost_per_1k_input: 0.27
    cost_per_1k_output: 1.1
  openrouter-big:
    provider: openai
    model: anthropic/claude-sonnet-5
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    cost_per_1k_input: 3.0
    cost_per_1k_output: 15.0
  # Model 2.5 generasi lama (gemini-2.5-flash / 2.5-pro) sudah tidak tersedia
  # untuk user baru (404 "no longer available") / kena quota 429 pada tier gratis.
  # Yang terverifikasi jalan: gemini-flash-latest (alias stabil) & gemini-3.x-flash.
  # Model Pro butuh tier berbayar.
  gemini-fast:
    provider: openai
    model: gemini-flash-latest
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY
    cost_per_1k_input: 0.1
    cost_per_1k_output: 0.4
  gemini-big:
    provider: openai
    model: gemini-3.6-flash
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY
    cost_per_1k_input: 1.25
    cost_per_1k_output: 10.0
  groq-fast:
    provider: openai
    model: llama-3.3-70b-versatile
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    cost_per_1k_input: 0.59
    cost_per_1k_output: 0.79
  deepseek-fast:
    provider: openai
    model: deepseek-chat
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    cost_per_1k_input: 0.27
    cost_per_1k_output: 1.1
  # ---- route bynara (https://router.bynara.id/v1) — OpenAI-compatible ----
  bynara-fast:
    provider: openai
    model: agnes-2.5-flash
    base_url: https://router.bynara.id/v1
    api_key_env: BYNARA_API_KEY
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
  bynara-medium:
    provider: openai
    model: stepfun-3.7-flash
    base_url: https://router.bynara.id/v1
    api_key_env: BYNARA_API_KEY
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
  bynara-big:
    provider: openai
    model: mistral-large
    base_url: https://router.bynara.id/v1
    api_key_env: BYNARA_API_KEY
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
  # ---- route opencode zen (https://opencode.ai/zen/v1) — OpenAI-compatible,
  #      gratis tanpa API key; model free tersedia (deepseek-v4-flash-free dll) ----
  opencode-zen-fast:
    provider: openai
    model: deepseek-v4-flash-free
    base_url: https://opencode.ai/zen/v1
    api_key_env: OPENCODE_ZEN_API_KEY
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
  opencode-zen-big:
    provider: openai
    model: claude-sonnet-5
    base_url: https://opencode.ai/zen/v1
    api_key_env: OPENCODE_ZEN_API_KEY
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
  opencode-zen-codex:
    provider: openai
    model: gpt-5.1-codex
    base_url: https://opencode.ai/zen/v1
    api_key_env: OPENCODE_ZEN_API_KEY
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
  # ---- model free lain di route zen (semua gratis tanpa key) ----
  opencode-zen-nemotron:
    provider: openai
    model: nemotron-3-ultra-free
    base_url: https://opencode.ai/zen/v1
    api_key_env: OPENCODE_ZEN_API_KEY
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
  opencode-zen-laguna:
    provider: openai
    model: laguna-s-2.1-free
    base_url: https://opencode.ai/zen/v1
    api_key_env: OPENCODE_ZEN_API_KEY
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
  opencode-zen-ling:
    provider: openai
    model: ling-3.0-flash-free
    base_url: https://opencode.ai/zen/v1
    api_key_env: OPENCODE_ZEN_API_KEY
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
  opencode-zen-mimo:
    provider: openai
    model: mimo-v2.5-free
    base_url: https://opencode.ai/zen/v1
    api_key_env: OPENCODE_ZEN_API_KEY
    cost_per_1k_input: 0.0
    cost_per_1k_output: 0.0
  opencode-zen-north:
    provider: openai
    model: north-mini-code-free
    base_url: https://opencode.ai/zen/v1
    api_key_env: OPENCODE_ZEN_API_KEY
