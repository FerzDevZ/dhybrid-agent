[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dhybrid-agent"
version = "0.5.5"
description = "CLI coding agent — powerful, token-efficient, hybrid-routed"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "prompt_toolkit>=3.0",
    "markitdown[pdf,docx,pptx,xlsx]>=0.1",
    "trafilatura>=1.6",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "pytest-cov>=5",
    "pytest-xdist>=3",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "pre-commit>=3.7",
]

[project.scripts]
dhybrid = "dhybrid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
