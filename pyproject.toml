[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dhybrid-agent"
version = "0.9.6"
description = "CLI coding agent — powerful, token-efficient, hybrid-routed"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "prompt_toolkit>=3.0",
    "markitdown[pdf,docx,pptx,xlsx]>=0.1",
    "trafilatura>=1.6",
    "rapidfuzz>=3.0",
    "pydantic>=2.0",
    "ddgs>=9.0",
    "rich>=13.0",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-php>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-c-sharp>=0.23",
    "sqlite-vec>=0.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "litellm>=1.40",
    "tenacity>=9.0",
]

[project.optional-dependencies]
e2e = [
    "playwright>=1.40",
]
vision = [
    "rapidocr-onnxruntime>=1.3",
    "python-xlib>=0.33",
]
power = [
    "psutil>=5.9",
    "jinja2>=3.1",
    "duckdb>=1.0",
    "pypdf>=4.0",
    "openpyxl>=3.1",
    "python-magic>=0.4",
]
redis = [
    "redis>=5.0",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "pytest-cov>=5",
    "pytest-xdist>=3",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "pre-commit>=3.7",
]

[project.scripts]
dhybrid = "dhybrid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.bandit]
skips = [
    "B404",  # import subprocess — by design: agent tool terminal/toolchain
    "B603",  # subprocess tanpa shell (list-args) — aman; shell=True sengaja + nosec B602
    "B607",  # partial exe path — toolchain bin/cargo/go dipanggil dari venv/PATH
    "B110",  # try-except-pass — handler soft-return (sudah diaudit, diberi logging)
    "B112",  # try-except-continue — skip entri rusak di marketplace (by design)
    "B101",  # assert — guard menjaga invariant (mcp stdin/stdout)
]